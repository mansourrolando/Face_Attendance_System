{% extends "base.html" %}

{% block title %}إضافة عطلة{% endblock %}

{% block styles %}
    <style>
        .form-box {
            background: white; border-radius: 8px; padding: 25px;
            max-width: 550px; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .form-group { margin-bottom: 15px; }
        .form-group label {
            display: block; margin-bottom: 5px; color: #333; font-weight: bold;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 10px; border: 1px solid #ddd;
            border-radius: 5px; font-family: inherit;
        }
        .form-group textarea { height: 80px; resize: vertical; }
        .form-group .hint {
            font-size: 12px; color: #999; margin-top: 3px;
        }
        .form-group .checkbox-row {
            display: flex; align-items: center; gap: 8px;
        }
        .form-group .checkbox-row input[type="checkbox"] {
            width: 18px; height: 18px; cursor: pointer;
        }
        .btn-save {
            background: #27ae60; color: white; padding: 10px 30px;
            border: none; border-radius: 5px; cursor: pointer; font-size: 14px;
        }
        .btn-save:hover { background: #219a52; }
        .btn-cancel {
            background: #7f8c8d; color: white; padding: 10px 20px;
            border: none; border-radius: 5px; cursor: pointer; font-size: 14px;
            text-decoration: none; display: inline-block; margin-right: 10px;
        }

        /* معاينة العطل القريبة */
        .preview-box {
            background: #f8f9fa; border-radius: 8px; padding: 15px;
            margin-top: 20px; max-width: 550px;
        }
        .preview-box h3 { color: #2c3e50; margin-bottom: 10px; font-size: 14px; }
        .preview-item {
            display: flex; justify-content: space-between; padding: 5px 0;
            font-size: 13px; color: #555; border-bottom: 1px solid #eee;
        }
        .preview-item:last-child { border-bottom: none; }
    </style>
{% endblock %}

{% block content %}
    <h1>إضافة عطلة رسمية</h1>

    <div class="form-box">
        <form action="{{ url_for('holidays.holiday_add') }}" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label>اسم العطلة</label>
                <input type="text" name="name" required placeholder="مثال: عيد الفطر - اليوم الأول">
            </div>

            <div class="form-group">
                <label>التاريخ</label>
                <input type="date" name="date" required>
            </div>

            <div class="form-group">
                <label>نوع العطلة</label>
                <select name="holiday_type">
                    {% for key, label in holiday_types.items() %}
                    <option value="{{ key }}" {% if key == 'national' %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <div class="checkbox-row">
                    <input type="checkbox" name="is_recurring" id="isRecurring">
                    <label for="isRecurring" style="margin-bottom: 0; cursor: pointer;">عطلة متكررة سنوياً</label>
                </div>
                <div class="hint">اختر هذا الخيار إذا كانت العطلة تتكرر بنفس التاريخ كل سنة (مثل: يوم العمال 1/5، عيد الميلاد 25/12)</div>
            </div>

            <div class="form-group">
                <label>ملاحظات</label>
                <textarea name="notes" placeholder="ملاحظات إضافية (اختياري)"></textarea>
            </div>

            <a href="{{ url_for('holidays.holidays') }}" class="btn-cancel">إلغاء</a>
            <button type="submit" class="btn-save">إضافة العطلة</button>
        </form>
    </div>
{% endblock %}
