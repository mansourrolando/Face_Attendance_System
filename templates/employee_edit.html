{% extends "base.html" %}

{% block title %}تعديل موظف{% endblock %}

{% block styles %}
    <style>
        .container-box {
            background: white; border-radius: 8px; padding: 25px;
            max-width: 600px; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .form-group { margin-bottom: 15px; }
        .form-group label {
            display: block; margin-bottom: 5px; color: #333; font-weight: bold;
        }
        .form-group input, .form-group select {
            width: 100%; padding: 10px; border: 1px solid #ddd;
            border-radius: 5px; font-family: inherit;
        }
        .btn-save {
            background: #27ae60; color: white; padding: 10px 30px;
            border: none; border-radius: 5px; cursor: pointer; font-size: 14px;
        }
        .btn-cancel {
            background: #95a5a6; color: white; padding: 10px 30px;
            border: none; border-radius: 5px; cursor: pointer; font-size: 14px;
            text-decoration: none; display: inline-block;
        }
    </style>
{% endblock %}

{% block content %}
    <h1>تعديل بيانات الموظف: {{ employee.name }}</h1>

    <div class="container-box">
        <form action="{{ url_for('employees.employee_edit', id=employee.id) }}" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label>الاسم الكامل *</label>
                <input type="text" name="name" value="{{ employee.name }}" required>
            </div>
            <div class="form-group">
                <label>القسم</label>
                <select name="department_id">
                    <option value="">اختر القسم</option>
                    {% for dept in departments %}
                        <option value="{{ dept.id }}" {% if employee.department_id == dept.id %}selected{% endif %}>{{ dept.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>البريد الإلكتروني</label>
                <input type="email" name="email" value="{{ employee.email or '' }}">
            </div>
            <div class="form-group">
                <label>الوظيفة</label>
                <input type="text" name="position" value="{{ employee.position or '' }}">
            </div>
            <div class="form-group">
                <label>رقم الهاتف</label>
                <input type="text" name="phone" value="{{ employee.phone or '' }}">
            </div>
            <div class="form-group">
                <label>تاريخ التوظيف</label>
                <input type="date" name="hire_date" value="{% if employee.hire_date %}{{ employee.hire_date.strftime('%Y-%m-%d') }}{% endif %}">
            </div>
            <div class="form-group">
                <label>حالة الموظف</label>
                <select name="status" id="statusSelect" onchange="toggleDeactivationFields()">
                    <option value="active" {% if employee.status == 'active' %}selected{% endif %}>نشط</option>
                    <option value="not_active" {% if employee.status == 'not_active' %}selected{% endif %}>غير نشط</option>
                </select>
            </div>

            <!-- حقول التعطيل - تظهر فقط عند اختيار غير نشط -->
            <div id="deactivationFields" style="{% if employee.status != 'active' %}display:block{% else %}display:none{% endif %}; background: #fff3cd; padding: 15px; border-radius: 8px; border: 1px solid #ffc107; margin-bottom: 15px;">
                <div class="form-group" style="margin-bottom: 10px;">
                    <label style="color: #856404;">سبب التعطيل *</label>
                    <select name="deactivation_reason" id="deactivationReason">
                        <option value="">اختر السبب</option>
                        <option value="استقالة" {% if employee.deactivation_reason == 'استقالة' %}selected{% endif %}>استقالة</option>
                        <option value="فصل" {% if employee.deactivation_reason == 'فصل' %}selected{% endif %}>فصل</option>
                        <option value="إنهاء عقد" {% if employee.deactivation_reason == 'إنهاء عقد' %}selected{% endif %}>إنهاء عقد</option>
                        <option value="إجازة طويلة" {% if employee.deactivation_reason == 'إجازة طويلة' %}selected{% endif %}>إجازة طويلة (بدون راتب)</option>
                        <option value="أخرى" {% if employee.deactivation_reason == 'أخرى' %}selected{% endif %}>أخرى</option>
                    </select>
                </div>
                <div class="form-group" style="margin-bottom: 5px;">
                    <label style="color: #856404;">تاريخ التعطيل</label>
                    <input type="date" name="deactivation_date" id="deactivationDate" value="{% if employee.deactivation_date %}{{ employee.deactivation_date.strftime('%Y-%m-%d') }}{% endif %}">
                    <small style="color: #856404; font-size: 12px; display: block; margin-top: 4px;">
                        سيتم تلقائياً: إلغاء الإجازات المعلقة ورفض طلبات الإجازة المستقبلية
                    </small>
                </div>
            </div>

            <button type="submit" class="btn-save">حفظ البيانات</button>
            <a href="{{ url_for('employees.employees') }}" class="btn-cancel">إلغاء</a>
        </form>
    </div>

    <script>
        function toggleDeactivationFields() {
            const status = document.getElementById('statusSelect').value;
            const fields = document.getElementById('deactivationFields');
            const dateInput = document.getElementById('deactivationDate');

            if (status === 'not_active') {
                fields.style.display = 'block';
                // ملء تاريخ اليوم تلقائياً لو فاضي
                if (!dateInput.value) {
                    const today = new Date().toISOString().split('T')[0];
                    dateInput.value = today;
                }
            } else {
                fields.style.display = 'none';
            }
        }

        // تشغيل عند التحميل
        document.addEventListener('DOMContentLoaded', function() {
            toggleDeactivationFields();
        });
    </script>
{% endblock %}
