{% extends "base.html" %}

{% block title %}تعديل قسم{% endblock %}

{% block styles %}
    <style>
        .form-box {
            background: white; border-radius: 8px; padding: 25px;
            max-width: 500px; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .form-group { margin-bottom: 15px; }
        .form-group label {
            display: block; margin-bottom: 5px; color: #333; font-weight: bold;
        }
        .form-group input, .form-group textarea {
            width: 100%; padding: 10px; border: 1px solid #ddd;
            border-radius: 5px; font-family: inherit;
        }
        .form-group textarea { height: 100px; resize: vertical; }
        .btn-save {
            background: #27ae60; color: white; padding: 10px 30px;
            border: none; border-radius: 5px; cursor: pointer; font-size: 14px;
        }
        .btn-cancel {
            background: #95a5a6; color: white; padding: 10px 30px;
            border: none; border-radius: 5px; cursor: pointer; font-size: 14px;
            text-decoration: none; display: inline-block;
        }
    </style>
{% endblock %}

{% block content %}
    <h1>تعديل بيانات قسم: {{ department.name }}</h1>
    <div class="form-box">
        <form action="{{ url_for('departments.department_edit', id=department.id) }}" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label>اسم القسم *</label>
                <input type="text" name="name" value="{{ department.name }}" required>
            </div>
            <div class="form-group">
                <label>الوصف</label>
                <textarea name="description">{{ department.description or '' }}</textarea>
            </div>
            <button type="submit" class="btn-save">حفظ البيانات</button>
            <a href="{{ url_for('departments.departments') }}" class="btn-cancel">إلغاء</a>
        </form>
    </div>
{% endblock %}
